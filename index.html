<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planificador de Tareas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="CSS/styles.css">
</head>

<body>
    <div class="container-fluid mt-4">
        <div class="tituloapp">
            <h2>Tu Planificador de Tareas Favorito</h2>
        </div>
        <div class="saludo">
            <h2 class="mb-4">Bienvenido</h2>
            <h3 class="mb-4">"Hoy es un gran día para soñar"</h3>
            <h5>Hoy</h5>
        </div>
        <div class="d-flex align-items-center justify-content-center gap-3">
            <button class=" btn btn-light me-3 flecha">◄</button>
            <div class="timeline">
                <div class="d-flex justify-content-center gap-3 overflow-auto flex-nowrap">
                    <div class="card p-3 text-center">
                        <h5 class="mb-2">27-julio-2026</h5>
                    </div>
                    <div class="card p-3 text-center">
                        <h5 class="mb-2">28-julio-2026</h5>
                    </div>
                    <div class="card p-3 text-center">
                        <h5 class="mb-2">29-julio-2026</h5>
                    </div>
                    <div class="card p-3 text-center">
                        <h5 class="mb-2">30-julio-2026</h5>
                    </div>
                    <div class="card p-3 text-center">
                        <h5 class="mb-2">31-julio-2026</h5>
                    </div>
                    <div class="card p-3 text-center">
                        <h5 class="mb-2">01-agosto-2026</h5>
                    </div>
                    <div class="card p-3 text-center">
                        <h5 class="mb-2">02-agosto-2026</h5>
                    </div>
                </div>
            </div>
            <button class="btn btn-light ms-3 flecha">►</button>
        </div>
        <div class="row mt-5 align-items-end">

    <div class="col-md-1">
        <label class="form-label">N°</label>
        <input type="text" class="form-control" value="1" readonly>
    </div>

    <div class="col-md-6">
        <label for="tarea" class="form-label">Escribe tus tareas del día:</label>
        <input type="text" class="form-control" id="tarea" placeholder="Escribe tu tarea aquí">
    </div>

    <div class="col-md-1">
        <label for="horainicial" class="form-label">Hora de inicio</label>
        <select class="form-select" id="horainicial">
            <option>08:00</option>
            <option>09:00</option>
            <option>10:00</option>
            <option>11:00</option>
            <option>12:00</option>
            <option>13:00</option>
            <option>14:00</option>
            <option>15:00</option>
            <option>16:00</option>
            <option>17:00</option>
            <option>18:00</option>
            <option>19:00</option>
            <option>20:00</option>
        </select>
    </div>

    <div class="col-md-1">
        <label for="horafinal" class="form-label">Hora final</label>
        <select class="form-select" id="horafinal">
            <option>08:00</option>
            <option>09:00</option>
            <option>10:00</option>
            <option>11:00</option>
            <option>12:00</option>
            <option>13:00</option>
            <option>14:00</option>
            <option>15:00</option>
            <option>16:00</option>
            <option>17:00</option>
            <option>18:00</option>
            <option>19:00</option>
            <option>20:00</option>
        </select>
    </div>

    <div class="col-md-1 text-center">
        <label class="form-label">Completar</label>
        <button class="btn btn-outline-success w-100">
            <i class="bi bi-check-circle"></i>
        </button>
    </div>

    <div class="col-md-1 text-center">
        <label class="form-label">Eliminar</label>
        <button class="btn btn-outline-secondary w-100">
            <i class="bi bi-trash-fill"></i>
        </button>
    </div>

        <div class="col-md-1 text-center">
        <label class="form-label">Agregar nueva tarea</label>
        <button class="btn btn-agregar w-100">
            <i class="bi bi-plus-circle"></i>
        </button>
    </div>

</div>
<footer class="text-white text-center p-4 mt-5">   <!-- text-white  es texto blanco,   mt-5 es el espacio entre las tarjetas y el footer-->
    <h5>Tu Planificador de Tareas Favorito</h5>
    <p class>&copy; 2026 Dannis Rincon. Todos los derechos reservados.</p>   <!--&copy es de html (no de bootstrap ni css), -->
</footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
